
<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Мой список задач</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Мой список задач</h1>

        <form id="taskForm">
            <input
                type="text"
                id="taskInput"
                placeholder="Введите новое задание..."
                required
            >

            <button type="submit">Добавить</button>
        </form>

        <h2>Мои задачи</h2>

        <ul id="taskList"></ul>

        <p id="emptyMessage">
            Пока нет заданий. Добавьте первое!
        </p>

    </div>

    <script src="script.js"></script>
</body>
</html>
